<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LLM Agent</title>
<style>
  :root {
    --bg: #ffffff; --bg-2: #f7f7f9; --bg-3: #f0f0f3;
    --surface: #ffffff; --surface-hover: #f5f5f8;
    --border: #e8e8ed; --border-strong: #d8d8e0;
    --text: #1a1a20; --text-2: #56566b; --text-3: #8a8a9e;
    --accent: #6366f1; --accent-soft: rgba(99,102,241,0.08); --accent-border: rgba(99,102,241,0.22);
    --green: #10b981; --red: #ef4444;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow: 0 2px 8px rgba(0,0,0,0.06);
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px); --safe-right: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; height: 100dvh; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
    font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(10px + var(--safe-top)) calc(16px + var(--safe-right)) 10px calc(16px + var(--safe-left));
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.85);
    backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    flex-shrink: 0; z-index: 10; min-height: 56px;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .logo {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(140deg, #8b7cff, #6366f1);
    display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(99,102,241,0.25);
  }
  .brand-text { min-width: 0; flex: 1; }
  .brand h1 { font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand .sub { font-size: 11px; color: var(--text-3); font-family: ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .status {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    background: var(--bg-2); border: 1px solid var(--border); font-size: 11px; color: var(--text-2);
    font-family: ui-monospace, monospace; white-space: nowrap;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px rgba(16,185,129,0.6); flex-shrink: 0; }
  .status.busy .dot { background: var(--accent); box-shadow: 0 0 8px rgba(99,102,241,0.6); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }
  .btn-icon {
    width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text-2); cursor: pointer; font-size: 14px; flex-shrink: 0; touch-action: manipulation;
    transition: background 0.15s, color 0.15s;
  }
  .btn-icon:hover { background: var(--surface-hover); color: var(--text); }
  .btn-icon:active { transform: scale(0.94); }

  #chat-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 24px calc(20px + var(--safe-right)) 24px calc(20px + var(--safe-left)); background: var(--bg-2); }
  #chat-wrap::-webkit-scrollbar { width: 6px; }
  #chat-wrap::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  #chat { max-width: 740px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  .empty { text-align: center; padding: 12vh 16px 0; color: var(--text-3); }
  .empty .logo-big {
    width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 16px;
    background: linear-gradient(140deg, #8b7cff, #6366f1);
    display: flex; align-items: center; justify-content: center; font-size: 26px;
    box-shadow: 0 8px 24px rgba(99,102,241,0.28);
  }
  .empty .title { font-size: 19px; font-weight: 600; color: var(--text); letter-spacing: -0.02em; margin-bottom: 6px; }
  .empty .hint { font-size: 13px; color: var(--text-3); margin-bottom: 28px; }
  .empty .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; max-width: 540px; margin: 0 auto; }
  .chip {
    text-align: left; padding: 12px 14px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; font-size: 13.5px; color: var(--text-2);
    cursor: pointer; touch-action: manipulation; user-select: none;
    display: flex; align-items: flex-start; gap: 10px; line-height: 1.45;
    box-shadow: var(--shadow-sm); transition: all 0.15s;
  }
  .chip:hover { border-color: var(--accent-border); color: var(--text); box-shadow: var(--shadow); transform: translateY(-1px); }
  .chip:active { transform: scale(0.98); }
  .chip .ico { font-size: 15px; flex-shrink: 0; margin-top: 1px; }

  .msg { display: flex; gap: 10px; animation: fadeUp 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { flex-direction: row-reverse; }
  .avatar { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; margin-top: 1px; }
  .msg.user .avatar { background: linear-gradient(140deg, #8b7cff, #6366f1); color: #fff; box-shadow: 0 2px 6px rgba(99,102,241,0.28); }
  .msg.assistant .avatar { background: var(--surface); border: 1px solid var(--border); color: var(--text-2); box-shadow: var(--shadow-sm); }
  .body { flex: 1; min-width: 0; max-width: 100%; }
  .msg.user .body { display: flex; flex-direction: column; align-items: flex-end; }
  .bubble {
    padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word;
    font-size: 14.5px; line-height: 1.65; max-width: 100%; letter-spacing: -0.005em;
  }
  .msg.user .bubble {
    background: linear-gradient(140deg, #8b7cff, #6366f1); color: #fff;
    border-bottom-right-radius: 5px; max-width: 82%; box-shadow: 0 2px 10px rgba(99,102,241,0.22);
  }
  .msg.assistant .bubble {
    background: var(--surface); border: 1px solid var(--border);
    border-bottom-left-radius: 5px; color: var(--text); box-shadow: var(--shadow-sm);
  }
  .msg.assistant .bubble code {
    background: var(--accent-soft); color: var(--accent); padding: 1px 6px; border-radius: 5px;
    font-family: ui-monospace, monospace; font-size: 12.5px; word-break: break-all; font-weight: 500;
  }

  .events { margin-bottom: 10px; }
  .events details {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; box-shadow: var(--shadow-sm); transition: border-color 0.15s;
  }
  .events details[open] { border-color: var(--accent-border); }
  .events summary {
    padding: 9px 13px; cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--text-2);
    list-style: none; user-select: none; display: flex; align-items: center; gap: 8px; touch-action: manipulation;
  }
  .events summary:hover { background: var(--surface-hover); }
  .events summary::-webkit-details-marker { display: none; }
  .events summary .chev { font-size: 9px; color: var(--text-3); transition: transform 0.2s; flex-shrink: 0; }
  .events details[open] summary .chev { transform: rotate(90deg); }
  .events summary .label { flex: 1; }
  .events summary .badge {
    font-size: 10.5px; padding: 1px 7px; background: var(--accent-soft); color: var(--accent);
    border-radius: 999px; font-family: ui-monospace, monospace; flex-shrink: 0;
    border: 1px solid var(--accent-border); font-weight: 600;
  }
  .events .list { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
  .event-item {
    padding: 10px 12px; background: var(--bg-2); border-radius: 10px;
    border-left: 3px solid var(--accent); font-size: 12.5px;
  }
  .event-item .head { display: flex; align-items: center; gap: 6px; color: var(--text); font-weight: 500; font-size: 12.5px; flex-wrap: wrap; }
  .event-item .head .tag {
    font-size: 9.5px; padding: 1px 5px; background: var(--accent-soft); color: var(--accent);
    border-radius: 4px; font-family: ui-monospace, monospace; text-transform: uppercase;
    letter-spacing: 0.04em; flex-shrink: 0; border: 1px solid var(--accent-border); font-weight: 600;
  }
  .event-item pre {
    background: var(--surface); padding: 8px 10px; border-radius: 7px; overflow-x: auto;
    font-family: ui-monospace, monospace; font-size: 11.5px; line-height: 1.55; color: var(--text-2);
    margin-top: 6px; white-space: pre-wrap; word-break: break-word; border: 1px solid var(--border);
  }
  .event-item ul { margin: 6px 0 0 0; padding: 0; list-style: none; }
  .event-item li { padding: 4px 0; color: var(--text-2); font-size: 12.5px; display: flex; gap: 8px; align-items: flex-start; line-height: 1.5; }
  .event-item li .step { font-family: ui-monospace, monospace; color: var(--accent); font-weight: 700; flex-shrink: 0; font-size: 11px; padding-top: 1px; }

  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 5px 2px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: bounce 1.3s ease-in-out infinite; }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: 0.35; } 30% { transform: translateY(-5px); opacity: 1; } }

  footer {
    padding: 10px calc(16px + var(--safe-right)) calc(48px + var(--safe-bottom)) calc(16px + var(--safe-left));
    background: rgba(255,255,255,0.9);
    backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .input-wrap {
    max-width: 740px; margin: 0 auto; display: flex; gap: 6px; padding: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    align-items: flex-end; box-shadow: var(--shadow); transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-wrap:focus-within { border-color: var(--accent-border); box-shadow: 0 2px 12px rgba(99,102,241,0.12); }
  footer textarea {
    flex: 1; padding: 9px 10px; background: transparent; border: none; color: var(--text);
    font-size: 16px; outline: none; font-family: inherit; resize: none;
    max-height: 120px; min-height: 24px; line-height: 1.5; overflow-y: auto; -webkit-appearance: none;
  }
  footer textarea::placeholder { color: var(--text-3); }
  footer button {
    width: 34px; height: 34px; background: linear-gradient(140deg, #8b7cff, #6366f1);
    color: #fff; border: none; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; touch-action: manipulation;
    box-shadow: 0 2px 8px rgba(99,102,241,0.3); transition: transform 0.15s, box-shadow 0.15s;
    margin-bottom: 1px;
  }
  footer button:hover:not(:disabled) { box-shadow: 0 4px 12px rgba(99,102,241,0.4); }
  footer button:active:not(:disabled) { transform: scale(0.9); }
  footer button:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; background: var(--bg-3); color: var(--text-3); }
  footer button svg { width: 16px; height: 16px; }

  @media (max-width: 640px) {
    header { padding: calc(8px + var(--safe-top)) calc(12px + var(--safe-right)) 8px calc(12px + var(--safe-left)); gap: 8px; min-height: 52px; }
    .logo { width: 26px; height: 26px; font-size: 13px; border-radius: 7px; }
    .brand h1 { font-size: 13.5px; }
    .brand .sub { display: none; }
    .status { padding: 3px 7px; gap: 5px; }
    .status span:last-child { display: none; }
    .btn-icon { width: 32px; height: 32px; font-size: 13px; }
    #chat-wrap { padding: 16px calc(12px + var(--safe-right)) 16px calc(12px + var(--safe-left)); }
    #chat { gap: 18px; }
    .empty { padding: 8vh 12px 0; }
    .empty .logo-big { width: 48px; height: 48px; font-size: 22px; margin-bottom: 16px; }
    .empty .title { font-size: 17px; }
    .empty .hint { font-size: 12px; margin-bottom: 22px; }
    .empty .chips { grid-template-columns: 1fr; gap: 6px; }
    .chip { padding: 10px 12px; font-size: 13px; }
    .msg { gap: 8px; }
    .avatar { width: 26px; height: 26px; font-size: 12px; border-radius: 7px; }
    .bubble { padding: 9px 12px; font-size: 14.5px; border-radius: 13px; }
    .msg.user .bubble { max-width: 85%; }
    footer { padding: 8px calc(10px + var(--safe-right)) calc(36px + var(--safe-bottom)) calc(10px + var(--safe-left)); }
    .input-wrap { border-radius: 18px; padding: 5px; }
    footer textarea { padding: 8px 9px; }
    footer button { width: 32px; height: 32px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🤖</div>
    <div class="brand-text">
      <h1>LLM Agent</h1>
      <div class="sub" id="info">connecting…</div>
    </div>
  </div>
  <div class="header-right">
    <div class="status" id="status"><span class="dot"></span><span id="status-text">ready</span></div>
    <button class="btn-icon" id="clearBtn" title="清空对话">🗑</button>
  </div>
</header>

<div id="chat-wrap">
  <div id="chat">
    <div class="empty" id="empty">
      <div class="logo-big">✨</div>
      <div class="title">有什么可以帮你？</div>
      <div class="hint">工具调用 · 长期记忆 · 任务规划 · 知识库检索</div>
      <div class="chips">
        <div class="chip" data-q="年假有几天"><span class="ico">📅</span><span>年假有几天</span></div>
        <div class="chip" data-q="北京天气怎么样"><span class="ico">🌤</span><span>北京天气怎么样</span></div>
        <div class="chip" data-q="一件299的衣服打7折加13%税多少钱"><span class="ico">🧮</span><span>打折+税费计算</span></div>
        <div class="chip" data-q="帮我查北京和上海的天气，然后对比哪个适合明天出游"><span class="ico">🧭</span><span>多步任务规划</span></div>
      </div>
    </div>
  </div>
</div>

<footer>
  <div class="input-wrap">
    <textarea id="input" placeholder="输入消息..." rows="1" autocomplete="off" spellcheck="false"></textarea>
    <button id="send" title="发送">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"></line>
        <polyline points="5 12 12 5 19 12"></polyline>
      </svg>
    </button>
  </div>
</footer>

<script>
const chatEl = document.getElementById('chat');
const wrapEl = document.getElementById('chat-wrap');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const infoEl = document.getElementById('info');
const statusEl = document.getElementById('status');
const statusText = document.getElementById('status-text');
const emptyEl = document.getElementById('empty');
const clearBtn = document.getElementById('clearBtn');
let busy = false, isComposing = false;

async function loadState() {
  try {
    const r = await fetch('/api/state'); const s = await r.json();
    infoEl.textContent = `${s.model} · ${s.knowledge_chunks} chunks`;
  } catch (e) { infoEl.textContent = 'offline'; statusText.textContent = 'error'; }
}
function removeEmpty() { if (emptyEl && emptyEl.parentNode) emptyEl.remove(); }
function scrollBottom(force) {
  if (force) { wrapEl.scrollTop = wrapEl.scrollHeight; return; }
  if (wrapEl.scrollHeight - wrapEl.scrollTop - wrapEl.clientHeight < 120) wrapEl.scrollTop = wrapEl.scrollHeight;
}
function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function autoResize() { inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px'; }

function addUser(text) {
  removeEmpty();
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="avatar">👤</div><div class="body"><div class="bubble">${escapeHtml(text)}</div></div>`;
  chatEl.appendChild(div); scrollBottom(true);
}
function addAssistant() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = `<div class="avatar">🤖</div><div class="body"><div class="events"></div><div class="bubble"></div></div>`;
  chatEl.appendChild(div); return div;
}
function getOrCreateDetails(container) {
  const events = container.querySelector('.events');
  let details = events.querySelector('details');
  if (!details) {
    details = document.createElement('details');
    details.innerHTML = `<summary><span class="chev">▶</span><span class="label">执行过程</span><span class="badge">0</span></summary><div class="list"></div>`;
    events.appendChild(details);
  }
  return details;
}
function bumpCount(details) {
  const badge = details.querySelector('.badge');
  badge.textContent = (parseInt(badge.textContent) || 0) + 1;
}
function renderEvent(container, kind, data) {
  const details = getOrCreateDetails(container);
  const list = details.querySelector('.list');
  const item = document.createElement('div');
  item.className = 'event-item';
  if (kind === 'plan') {
    let html = '<div class="head"><span class="tag">plan</span>📋 任务规划</div><ul>';
    for (const p of data.plan) html += `<li><span class="step">${p.step}</span><span>${escapeHtml(p.task)}</span></li>`;
    html += '</ul>';
    item.innerHTML = html;
  } else if (kind === 'tool_call') {
    item.innerHTML = `<div class="head"><span class="tag">tool</span>🔧 ${escapeHtml(data.name)}</div><pre>${escapeHtml(JSON.stringify(data.args))}</pre><pre>${escapeHtml(String(data.result))}</pre>`;
  }
  list.appendChild(item); bumpCount(details); scrollBottom();
}

async function sendMessage(textOverride) {
  const text = (textOverride || inputEl.value).trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true; statusEl.classList.add('busy'); statusText.textContent = 'thinking';
  inputEl.value = ''; autoResize();
  addUser(text);
  const assistantDiv = addAssistant();
  const bubble = assistantDiv.querySelector('.bubble');
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  scrollBottom(true);
  let gotContent = false;
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text}),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();
      for (const part of parts) {
        if (!part.trim()) continue;
        const lines = part.split('\n');
        let eventType = 'message', dataStr = '';
        for (const line of lines) {
          if (line.startsWith('event: ')) eventType = line.slice(7).trim();
          else if (line.startsWith('data: ')) dataStr += line.slice(6);
        }
        if (!dataStr) continue;
        let parsed;
        try { parsed = JSON.parse(dataStr); } catch (e) { continue; }
        if (eventType === 'done') { bubble.textContent = parsed.answer; gotContent = true; }
        else if (eventType === 'error') { bubble.innerHTML = `<span style="color:#ef4444">❌ ${escapeHtml(parsed.message)}</span>`; gotContent = true; }
        else if (eventType === 'tool_call' || eventType === 'plan') {
          if (!gotContent) { bubble.textContent = ''; gotContent = true; }
          renderEvent(assistantDiv, eventType, parsed);
        }
        scrollBottom();
      }
    }
  } catch (e) {
    bubble.innerHTML = `<span style="color:#ef4444">❌ 网络错误：${escapeHtml(e.message)}</span>`;
  }
  busy = false; sendBtn.disabled = false; statusEl.classList.remove('busy'); statusText.textContent = 'ready';
  if (window.innerWidth > 640) inputEl.focus();
  scrollBottom(true);
}

async function clearChat() {
  if (busy) return;
  if (!confirm('清空当前对话？')) return;
  await fetch('/api/clear', { method: 'POST' });
  location.reload();
}

sendBtn.addEventListener('click', () => sendMessage());
inputEl.addEventListener('input', autoResize);
inputEl.addEventListener('compositionstart', () => { isComposing = true; });
inputEl.addEventListener('compositionend', () => { isComposing = false; });
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !isComposing) { e.preventDefault(); sendMessage(); }
});
clearBtn.addEventListener('click', clearChat);
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => sendMessage(chip.dataset.q));
});
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => { if (!busy) scrollBottom(true); });
}
loadState(); autoResize();
if (window.innerWidth > 640) inputEl.focus();
</script>
</body>
</html>
